services:
  - type: web
    name: clinic-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[dev]"
    startCommand: sh ./start-backend.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.onrender.com
      - key: ALLOWED_ORIGIN_REGEX
        value: ""
  - type: web
    name: clinic-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://clinic-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: clinic-db
    plan: free
    databaseName: clinic
    user: clinic
